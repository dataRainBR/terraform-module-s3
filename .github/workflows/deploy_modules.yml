name: Deploy Terraform Module

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout com histórico e tags
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Git config
      - name: Configure git
        run: |
          git config --global user.email "github.bot@datarain.com.br"
          git config --global user.name "github_bot"

      # Setup Python para Checkov
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Instalar Checkov
      - name: Install Checkov
        run: |
          pip install checkov

      # Runc Checkov scan
      - name: Run Checkov security scan
        run: |
          checkov -d module/ --framework terraform --output cli

      # Get current version
      - name: Get current version
        id: version
        run: |
          CURRENT_VERSION=$(git tag --sort=-v:refname \
            | grep -E "^[0-9]+\.[0-9]+\.[0-9]+$" \
            | head -1 || true)

          if [ -z "$CURRENT_VERSION" ]; then
            MAJOR=0
            MINOR=0
            PATCH=0
          else
            MAJOR=$(echo "$CURRENT_VERSION" | cut -d '.' -f 1)
            MINOR=$(echo "$CURRENT_VERSION" | cut -d '.' -f 2)
            PATCH=$(echo "$CURRENT_VERSION" | cut -d '.' -f 3)
          fi

          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "MAJOR=$MAJOR" >> $GITHUB_ENV
          echo "MINOR=$MINOR" >> $GITHUB_ENV
          echo "PATCH=$PATCH" >> $GITHUB_ENV

      # Tipo do PR by branch
      - name: Detect branch type
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          TYPE_PR_NAME="${BRANCH_NAME%%/*}"

          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "TYPE_PR_NAME=$TYPE_PR_NAME" >> $GITHUB_ENV

      # New version
      - name: Calculate new version
        run: |
          if [ "$TYPE_PR_NAME" = "release" ]; then
            NEW_VERSION="$(($MAJOR + 1)).0.0"
          elif [ "$TYPE_PR_NAME" = "feature" ]; then
            NEW_VERSION="$MAJOR.$(($MINOR + 1)).0"
          else
            NEW_VERSION="$MAJOR.$MINOR.$(($PATCH + 1))"
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # Create tag
      - name: Create tag
        run: |
          git tag -a "$NEW_VERSION" -m "Tagging for new version $NEW_VERSION"

      # Push tag
      - name: Push tag
        run: |
          git push origin --tags

      # Auto-merge pull request after successful deployment
      - name: Auto-merge pull request
        if: success()
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: ""
          MERGE_METHOD: squash
